{% extends "base.html" %}

{% block content %}
<div class="space-y-8">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Cohort Management &mdash; <span
                    class="text-slate-400 font-medium">Timelines</span></h1>
            <p class="text-slate-400 mt-2">Adjust start/end dates and enrollment status for all cohorts.</p>
        </div>
        <a href="{% url 'admin-dashboard' %}"
            class="px-4 py-2 bg-brand-darkblue/80 hover:bg-brand-darkblue text-white rounded-xl transition-colors border border-brand-grey/20">Back
            to Dashboard</a>
    </div>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        {% for c in cohorts %}
        <div class="p-6 rounded-2xl bg-white/5 border border-brand-grey/20 backdrop-blur-sm">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-white">{{ c.name }}</h2>
                <div
                    class="h-2 w-2 rounded-full {% if c.is_active %}bg-brand-teal shadow-[0_0_10px_rgba(10,178,142,0.5)]{% else %}bg-brand-grey{% endif %}">
                </div>
            </div>

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="cohort_id" value="{{ c.id }}">

                <div>
                    <label for="id_start_date_{{ c.id }}"
                        class="block text-[10px] font-bold text-brand-grey uppercase tracking-widest mb-1">Start
                        Date</label>
                    <input type="date" id="id_start_date_{{ c.id }}" name="start_date"
                        value="{{ c.start_date|date:'Y-m-d' }}" title="Start Date"
                        class="w-full bg-brand-darkblue border border-brand-grey/20 text-white text-sm rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-lightblue outline-none">
                </div>

                <div>
                    <label for="id_end_date_{{ c.id }}"
                        class="block text-[10px] font-bold text-brand-grey uppercase tracking-widest mb-1">End
                        Date</label>
                    <input type="date" id="id_end_date_{{ c.id }}" name="end_date" value="{{ c.end_date|date:'Y-m-d' }}"
                        title="End Date"
                        class="w-full bg-brand-darkblue border border-brand-grey/20 text-white text-sm rounded-xl px-4 py-2 focus:ring-2 focus:ring-brand-lightblue outline-none">
                </div>

                <div class="flex items-center justify-between pt-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" name="is_active" {% if c.is_active %}checked{% endif %} class="hidden">
                        <div
                            class="w-10 h-5 bg-brand-grey/20 rounded-full relative transition-colors group-has-[:checked]:bg-brand-teal/50">
                            <div
                                class="absolute top-1 left-1 w-3 h-3 bg-white rounded-full transition-all group-has-[:checked]:left-6">
                            </div>
                        </div>
                        <span
                            class="text-xs text-brand-grey font-bold group-has-[:checked]:text-brand-teal">Active</span>
                    </label>
                    <button type="submit"
                        class="px-4 py-2 bg-brand-lightblue hover:bg-brand-lightblue/80 text-brand-darkblue text-xs font-bold rounded-xl transition-all shadow-lg shadow-blue-500/20">Save
                        Changes</button>
                </div>
            </form>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
