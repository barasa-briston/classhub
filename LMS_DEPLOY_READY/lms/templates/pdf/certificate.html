<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            font-family: 'Times-Roman', serif;
            margin: 0;
            padding: 0;
            line-height: normal; /* Restore normal flow for internal containers */
        }

        /* The master container - slightly smaller than A4 to prevent triggering 
           the hidden page boundary between Page 1 and Page 2 */
        .master-canvas {
            display: block;
            width: 29.65cm;
            height: 20.95cm;
            position: relative;
        }

        .bg-img {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .student-name {
            position: absolute;
            top: 11.2cm; /* Precisely over blue placeholder */
            left: 3.15cm;
            width: 21cm;
            font-family: 'Times-BoldItalic', serif;
            font-size: 38pt;
            color: #000000;
            text-align: left;
            z-index: 100;
        }

        .cert-footer {
            position: absolute;
            top: 19.3cm;
            left: 0;
            width: 29.7cm;
            font-size: 8.5pt;
            color: #333;
            text-align: center;
            line-height: 1.2;
            z-index: 100;
        }
    </style>
</head>

<body>
    <div class="master-canvas">
        <!-- FIXED PATH: Empty ccna1 chuka university certificate.jpg -->
        <img src="C:\Users\BRISTON\Desktop\CCNA CLASSES\lms\lms\images\Empty ccna1 chuka university certificate.jpg" class="bg-img">

        <div class="student-name">
            {{ student_name }}
        </div>

        <div class="cert-footer">
            <div>Date Issued: {{ issue_date|date:"jS F Y" }}</div>
            <div>Certificate No: {{ cert_no }}</div>
        </div>
    </div>
</body>

</html>
