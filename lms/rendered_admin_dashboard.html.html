<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chuka University CUCCNA Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <link rel="stylesheet" href="/static/css/admin_tweaks.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100">
  <div class="max-w-6xl mx-auto px-4 py-6">

    <header class="flex items-center justify-between gap-4 mb-6">
      <a href="/" class="flex items-center gap-3 group transition-opacity hover:opacity-80">
        <img src="/static/images/university_logo.png" alt="Chuka University Logo"
          class="h-10 w-10 object-contain rounded-xl bg-white/10 border border-white/10">
        <div>
          <div class="font-bold leading-tight text-sm tracking-tight uppercase">CHUKA UNIVERSITY</div>
          <div class="text-[10px] text-slate-400 font-medium">CISCO Network Academy</div>
        </div>
      </a>

      <div class="flex items-center gap-3">
        
        
        
      </div>
    </header>

    

    <div class="rounded-2xl bg-white/5 border border-white/10 p-4 md:p-6">
      
<div class="space-y-8">
  <div class="flex items-center justify-between gap-4 flex-wrap">
    <h1 class="text-3xl font-extrabold text-white tracking-tight">Admin Dashboard</h1>
    <div class="flex items-center gap-2">
      <a href="/manage-users/"
        class="px-4 py-2 bg-slate-800 text-slate-300 text-sm font-bold rounded-xl border border-slate-700">Users</a>
      <a href="/manage-cohorts/"
        class="px-3 py-2 bg-slate-800 text-slate-300 text-sm font-bold rounded-xl border border-slate-700">Cohorts</a>
      <a href="/manage-lecturers/"
        class="px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-xl shadow-lg">Lecturers</a>
    </div>
  </div>

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    <div class="p-6 rounded-2xl bg-slate-800/50 border border-slate-700 lg:col-span-3">
      <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Pending Approvals</h3>
      <div class="space-y-3">
        
        
        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border border-slate-700/50">
          <div>
            <span class="text-white font-bold block text-sm">Assignment 1</span>
            <span class="text-slate-500 text-[10px]">lecturer</span>
          </div>
          <form method="POST" action="/approve-assignment/1/">
            
            <button type="submit"
              class="px-3 py-1 bg-emerald-500 text-white text-[10px] font-bold rounded-lg hover:bg-emerald-600">Approve</button>
          </form>
        </div>
        
        
      </div>
    </div>

    <div class="p-6 rounded-2xl bg-slate-800/50 border border-slate-700 lg:col-span-3">
      <h2 class="text-xl font-bold text-white mb-6">Student Grades</h2>
      <div class="space-y-4">
        
      </div>
    </div>
  </div>
</div>

    </div>

    <footer class="mt-12 py-6 border-t border-white/10 text-center">
      <p class="text-[12px] text-slate-400 font-medium">
        2026 &copy; Designed by <span class="text-pink-500 font-bold">Cisco Academy</span>
      </p>
    </footer>

  </div>
</body>

</html>
