<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body{font-family:Arial;background:#f6f6f6;}
    .box{max-width:380px;margin:80px auto;background:white;padding:25px;border-radius:10px}
    input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
    button{width:100%;padding:10px;background:#ff7a00;color:white;border:none;border-radius:6px;font-weight:bold}
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
