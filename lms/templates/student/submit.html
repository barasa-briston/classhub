<!DOCTYPE html>
<html>
<head>
  <title>Submit Assignment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family: Arial; background:#f5f7fb; padding:30px;">

  <div style="max-width:700px; margin:auto; background:#fff; padding:22px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06);">
    <a href="{% url 'student-dashboard' %}" style="text-decoration:none;">⬅ Back</a>

    <h2 style="margin-top:10px;">Submit: {{ assignment.title }}</h2>
    <p style="color:#666;">{{ assignment.description|default:"No description" }}</p>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <label style="display:block; margin-bottom:8px; font-weight:bold;">
        Upload files (PDF / images / .pka)
      </label>
      <input type="file" name="files" multiple required style="width:100%; padding:10px;">

      <button type="submit"
              style="margin-top:14px; background:#16a34a; color:#fff; padding:10px 14px; border-radius:10px; border:none;">
        Submit
      </button>
    </form>
  </div>

</body>
</html>
